# East Fork comparison run using new PLET/RUSLE load generation
verbose: True
outputs: ./examples/east_fork/outputs

random_seed: 42

domain: ./examples/east_fork/inputs/domain.gpkg
parcels: ./examples/east_fork/inputs/parcels.gpkg
outlet_loc: ./examples/east_fork/inputs/outlet_loc.gpkg

parcel_out: ./examples/east_fork/inputs/parcel_out.csv
parcel_up: ./examples/east_fork/inputs/parcel_up.csv
parcel_p: ./examples/east_fork/inputs/parcel_p.csv

pollutants: ["TN","TP","TSS"]
cps: [340,329,590,412,656]

pollutant_yield: ./examples/east_fork/inputs/pollutant_yield.csv
bmp_efficiency: ./examples/east_fork/inputs/bmp_efficiency.csv

load_generation:
  mode: plet_rusle
  plet_inputs: ./examples/east_fork/inputs/plet/plet_inputs.csv
  rusle_inputs: ./examples/east_fork/inputs/plet/rusle_inputs.csv
  pollutant_concentrations: ./examples/east_fork/inputs/plet/pollutant_concentrations.csv
  groundwater_concentrations: ./examples/east_fork/inputs/plet/groundwater_concentrations.csv
  pathway_mode: derive_from_plet
  groundwater_loads: true
  treat_groundwater_with_bmps: false
  process_parameter_mode: true
  bmp_parameter_effects: ./examples/east_fork/inputs/plet/bmp_parameter_effects.csv
  process_parameter_fallback: efficiency

bmp_cost: ./examples/east_fork/inputs/bmp_cost.csv
outlet_target: ./examples/east_fork/inputs/outlet_target.csv
outlet_mean: ./examples/east_fork/inputs/outlet_mean.csv

n_scenarios: 1
bmp_limit_n: 500
buffer_depth_ft: 35

parallel:
  n_jobs: 1

bmp_sel_prob_via_costs: False
pollutant_yield_frac_surface: 0.3
pollutant_yield_frac_shallow: 0.4
bmp_fail_rate: 0.25
bmp_fail_reduction: 0.25
