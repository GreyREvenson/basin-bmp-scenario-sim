# Example East Fork (OH) watershed configuration (synthetic data)
verbose: True
random_seed: 42

outputs: ../../outputs/run_lit_stochastic
domain: ../domain/east_fork_domain.gpkg
parcels: ../parcels/parcels_ex1dot2_lit_based_load_gen_stochastic.gpkg
outlets: ../outlets/outlets.gpkg
bmp_efficiency: ../bmps/efficiency/bmp_efficiency_ex1dot2_lit_based_stochastic.csv
bmp_cost: ../bmps/costs/bmp_cost_ex2_stochastic.csv

pollutants: ["TN", "TP", "TSS"]
cps: [340, 329, 590, 412, 656]

load_generation:
  mode: statistical

# using statistical load generation, one areal load rate is sampled per parcel and pollutant and then partitioned across defined pathways
pollutant_load_rate_pathway_fractions:
  surface: 0.30
  shallow subsurface: 0.40
  deep subsurface: 0.30

n_scenarios: 10
bmp_limit_n: 500
buffer_depth_ft: 35

parallel:
  n_jobs: 10

bmp_sel_prob_via_costs: False
bmp_fail_rate: 0.25
bmp_fail_reduction: 0.25
