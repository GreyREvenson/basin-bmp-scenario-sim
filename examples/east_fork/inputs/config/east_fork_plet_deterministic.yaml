# East Fork comparison run using PLET/RUSLE load generation
verbose: True
outputs: ../../outputs/run_plet_deterministic
random_seed: 42

domain: ../domain/domain.gpkg
parcels: ../parcels/parcels_plet_deterministic.gpkg
# Optional HUC-scale model parameters. This legacy-format package contains a spatial
# huc12 layer plus HUC12-keyed input_* tables with fixed/distribution values.
# See docs/plet_rusle_mode.md.
huc_parameters: ../hucs/huc12s_plet_deterministic.gpkg
outlets: ../outlets/outlets.gpkg

pollutants: ["TN", "TP", "TSS"]
cps: [340, 329, 590, 412, 656]


bmp_efficiency: ../bmps/bmp_efficiency_plet_deterministic.csv
bmp_cost: ../bmps/bmp_cost_deterministic.csv

# Every parcel-side model variable is stored in its own input_* table
# inside parcels.gpkg, including curve number and infiltration fraction.
load_generation:
  mode: plet_rusle

n_scenarios: 10
bmp_limit_n: 500
buffer_depth_ft: 35

parallel:
  n_jobs: 10

bmp_sel_prob_via_costs: False
bmp_fail_rate: 0.0
bmp_fail_reduction: 0.0

deterministic_parcel_order: True
deterministic_bmp_type_order: True
deterministic_bmp_design_parameters: True