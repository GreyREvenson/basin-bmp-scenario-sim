# East Fork comparison run using PLET/RUSLE load generation
verbose: True
outputs: ../../outputs/plet/run_1
random_seed: 42

domain: ../domain/domain.gpkg
parcels: ../parcels/parcels.gpkg
outlets: ../outlets/outlets.gpkg

pollutants: ["TN", "TP", "TSS"]
cps: [340, 329, 590, 412, 656]

# Optional catalog for reusable fixed values or distributions.
input_distributions: ../misc/input_distributions.csv

bmp_efficiency: ../bmps/bmp_efficiency_plet_static.csv
bmp_cost: ../bmps/bmp_cost.csv

# PLET/RUSLE parcel parameters and pollutant concentrations are read from
# parcel_parameters and pollutant_concentrations inside parcels.gpkg.
# The hydrology lookup remains a separate user-editable input.
load_generation:
  mode: plet_rusle
  hydrology_lookup: ../plet/plet_hydrology_lookup.csv

n_scenarios: 1
bmp_limit_n: 500
buffer_depth_ft: 35

parallel:
  n_jobs: 1

bmp_sel_prob_via_costs: False
bmp_fail_rate: 0.25
bmp_fail_reduction: 0.25
