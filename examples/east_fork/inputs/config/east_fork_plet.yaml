# East Fork comparison run using PLET/RUSLE load generation
verbose: True
outputs: ../../outputs/plet/run_1

random_seed: 42

domain: ../domain/domain.gpkg
parcels: ../parcels/parcels.gpkg
outlet_loc: ../outlets/outlet_loc.gpkg

parcel_out: ../parcels/parcel_out.csv
parcel_up: ../parcels/parcel_up.csv
parcel_p: ../parcels/parcel_p.csv
pollutants: ["TN", "TP", "TSS"]
cps: [340, 329, 590, 412, 656]

# Optional catalog for reusable fixed values or distributions. Any numeric
# input row can reference a distribution_id from this file.
input_distributions: ../misc/input_distributions.csv

bmp_efficiency: ../bmps/bmp_efficiency_plet_static.csv
bmp_cost: ../bmps/bmp_cost.csv

load_generation:
  mode: plet_rusle
  plet_inputs: ../parcels/plet_inputs.csv
  hydrology_lookup: ../parcels/plet_hydrology_lookup.csv
  rusle_inputs: ../parcels/rusle_inputs_static.csv
  pollutant_concentrations: ../parcels/pollutant_concentrations.csv

outlet_target: ../outlets/outlet_target.csv
outlet_mean: ../outlets/outlet_mean.csv

n_scenarios: 1
bmp_limit_n: 500
buffer_depth_ft: 35

parallel:
  n_jobs: 1

bmp_sel_prob_via_costs: False
bmp_fail_rate: 0.25
bmp_fail_reduction: 0.25
