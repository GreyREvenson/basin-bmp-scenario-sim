# Example East Fork (OH) watershed configuration (synthetic data)
verbose: True
outputs: ../../outputs/run_lit_deterministic
random_seed: 42

# Consolidated geospatial/input packages
domain: ../domain/domain.gpkg
parcels: ../parcels/parcels_lit_deterministic.gpkg
outlets: ../outlets/outlets.gpkg

pollutants: ["TN", "TP", "TSS"]
cps: [340, 329, 590, 412, 656]


bmp_efficiency: ../bmps/bmp_efficiency_lit_deterministic.csv
bmp_cost: ../bmps/bmp_cost_deterministic.csv

# Statistical load rates use input_pollutant_load_rate. This example supplies
# parcel rows; the same table may be supplied in domain.gpkg or huc_parameters.
load_generation:
  mode: statistical

# One aggregate areal load rate is sampled per parcel and pollutant, then
# partitioned across the pathways defined by bmp_efficiency.
pollutant_load_rate_pathway_fractions:
  surface: 0.30
  shallow subsurface: 0.40
  deep subsurface: 0.30

n_scenarios: 10
bmp_limit_n: 500
buffer_depth_ft: 35

parallel:
  n_jobs: 10

bmp_sel_prob_via_costs: False
bmp_fail_rate: 0.0
bmp_fail_reduction: 0.0

deterministic_parcel_order: True
deterministic_bmp_type_order: True
deterministic_bmp_design_parameters: True
